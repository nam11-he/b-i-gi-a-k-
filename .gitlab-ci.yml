# GitLab CI for NamBeDe (midterm build). Every service is built and tested in its own job, with the same images
# as the Dockerfiles, and a job runs only when its folder (or this file) changes.
# Run one job on your own machine with Docker: npx gitlab-ci-local <job name>

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never # the merge request pipeline already covers this push
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

# Spring Boot services: compile, unit tests (no database needed), package the jar
.spring-service:
  image: eclipse-temurin:17-jdk-noble
  variables:
    MAVEN_USER_HOME: $CI_PROJECT_DIR/.m2
  cache:
    key: maven-$SERVICE
    paths:
      - .m2/
  script:
    - cd services/$SERVICE
    - ./mvnw -B -ntp -Dmaven.repo.local=$MAVEN_USER_HOME/repository verify
  artifacts:
    when: always
    reports:
      junit: services/*/target/surefire-reports/TEST-*.xml

auth-service:
  extends: .spring-service
  variables:
    SERVICE: auth-service
  rules:
    - changes: [services/auth-service/**/*, .gitlab-ci.yml]

# FastAPI services: install exactly what uv.lock pins, then pytest (learning-service tests use SQLite)
.python-service:
  image: ghcr.io/astral-sh/uv:0.12.21-python3.12-trixie-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
  cache:
    key: uv-$SERVICE
    paths:
      - .uv-cache/
  script:
    - cd services/$SERVICE
    - uv run --locked pytest -q --junitxml=report.xml
    - uv cache prune --ci
  artifacts:
    when: always
    reports:
      junit: services/*/report.xml

gateway:
  extends: .python-service
  variables:
    SERVICE: gateway
  rules:
    - changes: [services/gateway/**/*, .gitlab-ci.yml]

learning-service:
  extends: .python-service
  variables:
    SERVICE: learning-service
  rules:
    - changes: [services/learning-service/**/*, .gitlab-ci.yml]

# React web: lint, unit tests (Vitest), type check and production build
web:
  image: node:24-alpine
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - cd web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm test
    - npm run build
  rules:
    - changes: [web/**/*, .gitlab-ci.yml]

# The whole system in Docker, then scripts/system_test.py through the gateway, like a client: the gateway, Auth Service
# and Learning Service together. Needs a runner that allows Docker-in-Docker (privileged).
system-test:
  tags: [dind]
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  timeout: 30m
  script:
    - apk add --no-cache python3
    # Maven tests already ran in the auth-service job
    - echo 'SKIP_TESTS=true' > .env
    - docker compose up -d --build --wait
    # Ports are published on the Docker-in-Docker host, reachable as "docker"
    - python3 scripts/system_test.py --api http://docker:8000/api
  after_script:
    - docker compose logs --no-color > compose.log
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - compose.log
  rules:
    - changes: [services/**/*, scripts/system_test.py, scripts/demo_data.py, docker-compose.yml, infra/**/*, .gitlab-ci.yml]
