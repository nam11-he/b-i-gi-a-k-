[project]
name = "learning-service"
version = "0.1.0"
description = "NamBeDe Learning Service: topics, question bank, practice, vocabulary, streak, ranking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pyjwt[crypto]>=2.10",
    "pydantic-settings>=2.6",
    "tzdata>=2025.2",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
