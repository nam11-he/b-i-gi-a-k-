# Serves the built React app at http://nambede.dev.localhost and forwards /api to the gateway,
# so the browser talks to a single origin (no CORS needed).
server {
    listen 80;
    server_name nambede.dev.localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS, resolved per request: nginx starts and recovers even if the gateway is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;

    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Build files have content hashes in their names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /dashboard, /users, ...) all load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
